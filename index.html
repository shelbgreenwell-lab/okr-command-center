<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OKR Command Center</title>
  <meta name="description" content="An OKR operating system for executive teams: alignment, weekly check-ins, risks and decisions, an auto-written exec brief, and an Ask assistant." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%232a78d6' stroke-width='4'/><circle cx='16' cy='16' r='5' fill='%232a78d6'/></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3.5"/><circle cx="16" cy="16" r="5" fill="currentColor"/></svg>
      <div><div class="brand-name">OKR Command Center</div><div class="brand-co" id="company"></div></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="btn sm ghost" data-action="settings">⚙ Settings & data</button>
      <div class="muted tiny">Demo company and data are fictional.</div>
    </div>
  </aside>
  <div class="shell">
    <div class="topbar">
      <button class="icon-btn menu-btn" data-action="menu" aria-label="Menu">☰</button>
      <span class="qpill" id="qpill"></span>
      <span class="muted small" id="asof"></span>
    </div>
    <main id="main"></main>
  </div>
  <div class="drawer-scrim" data-action="close-drawer"></div>
  <aside id="drawer" class="drawer" aria-label="Key result detail"></aside>
  <div id="modal" class="modal"></div>

  <script src="js/util.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ask.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
